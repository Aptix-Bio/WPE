#
# The only way a release is made (Eclipse2's release.yml): run by hand from
# main, it tags the commit with the next counted tag, v<WPE version>-<build>
# (.github/scripts/release_tag.sh; Ryan, 2026-11-15: "We'll want
# auto-tagging"), then builds and publishes it through _build-release.yml in
# this same run. Nothing is typed: the version is the one the manifest pins,
# and the build number counts that version's tags. The tag is pushed with
# GITHUB_TOKEN, which starts no workflow, and a ruleset refuses tags made any
# other way, so nothing else can start a release build. A failed build is
# retried with "Re-run failed jobs", which keeps the tag; "Re-run all jobs"
# would count and tag again.
#
# Iris-Core's tools/bootstrap.py pins each bundle by its tag and SHA-256.
on:
  workflow_dispatch:

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Two runs must not count the same build number; only this job, so builds
    # of two tags may overlap.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write   # the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # every tag, which the build number counts
      - name: Tag the next build on main
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main || { echo "::error::run from main, not ${GITHUB_REF}"; exit 1; }
          tag=$(.github/scripts/release_tag.sh next)
          # Made through the API, so the job holds no push credential; a ref
          # that exists already (another run's) fails here, not later.
          object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" -f tag="${tag}" -f message="WPE WebKit BaseApp ${tag#v}" \
            -f object="${GITHUB_SHA}" -f type=commit --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${object}" >/dev/null
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "::notice::${tag} tagged on ${GITHUB_SHA::7}"

  # Built only here: _build-release.yml has no trigger of its own.
  build-release:
    needs: tag
    permissions:
      contents: write       # the Release
      id-token: write       # the compiler cache (_cloud) and the attestation's certificate
      attestations: write
    uses: ./.github/workflows/_build-release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
